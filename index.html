{h:"ALPHA 3",sub:"Дело № 001. Тайна трёх подписей",stamp:"СЕКРЕТНО",t:"У предприятия есть 30 дней. Заказы есть, оборудование есть, склад забит. Но денег не хватает, производство останавливается, а покупатели теряют терпение. Кто допустил ошибку? И можно ли ещё спасти завод?",q:"Архив ALPHA 3. Доступ только для приглашённых консультантов."},
{h:"Шесть лет назад",sub:"Из архива компании · история основания",stamp:"АРХИВ",t:"Трое друзей открыли своё дело. Капитала и громких имён не было: маленький цех, один подержанный станок и огромное желание. Так появилась ALPHA 3.",list:["<b>Собственник № 1 — производство:</b> оборудование, мощности, выполнение заказов.","<b>Собственник № 2 — закупки и склад:</b> поставщики, материалы, запасы.","<b>Собственник № 3 — финансы и договоры:</b> деньги, расчёты с покупателями, кредиты."],letter:"На стене цеха висел плакат: «Через пять лет — крупнейший завод региона!» Кто-то карандашом дописал внизу: «И личный вертолёт собственникам». Тогда все смеялись. Сейчас уже не до смеха."},
{h:"Золотые годы",sub:"Выдержка из корпоративного архива",stamp:"ПОЧТИ ИДЕАЛЬНО",t:"Мощности росли, заказы сыпались, склады наполнялись. Но вместе с ростом изменилось управление: решения принимались быстрее, проверки откладывались, документы подписывали без обсуждения. Запись с собрания:",letter:"«Есть деньги — покупаем оборудование. Есть скидка — закупаем материалы. Есть заказ — берёмся за работу. Разберёмся по ходу».",q:"Нажмите на плашку: последняя строка записи сделана другим почерком. "+"<span class=red-act>«Когда-нибудь это закончится проблемами». Автор неизвестен.</span>"},
{h:"Последние шесть месяцев",sub:"Внутренний отчёт ALPHA 3",stamp:"КРИЗИС",list:["Мощности перестали соответствовать реальным потребностям.","На складе материалы, которые не используются, и при этом дефицит комплектующих.","Готовая продукция лежит и не превращается в деньги.","Денег не хватает на текущие обязательства.","Сотрудники получают противоречивые распоряжения от разных собственников."],q:"Из отчёта финансового отдела: «Компания продолжает работать, но её ресурсы используются всё менее эффективно»."},
{h:"Ночное сообщение",sub:"Обнаружено в архиве",stamp:"ОБНАРУЖЕНО",big:[["23:47","восстановлен неизвестный файл"],["3 мес.","назад изменён"]],t:"THREE_SIGNATURES_FINAL.pdf. Отправитель не установлен. Получатели: три собственника ALPHA 3. Файл восстановлен частично.",letter:"«Если вы читаете это письмо, значит, ситуация стала достаточно серьёзной, чтобы наконец обратить на неё внимание»."},
{h:"Письмо без имени",sub:"Фрагмент № 001 · конфиденциально",stamp:"КОНФИДЕНЦИАЛЬНО",letter:"«Вы уверены, что знаете, почему ваше предприятие оказалось в таком положении? В документах всё благополучно: оборудование на балансе, склад заполнен, заказы есть. Но почему производство останавливается? Почему готовая продукция лежит, а деньги не поступают? Возможно, проблема не в одном ошибочном решении. Возможно, проблема в трёх подписях».",t:"Примечание: в приложении упомянуты три решения трёх собственников. Каждое официально согласовано. Последствия никто не оценил в совокупности."},
{h:"Три подписи",sub:"Фрагмент № 002 · письмо скомкано",stamp:"КОНФИДЕНЦИАЛЬНО",note:["Нажмите, чтобы развернуть листок","Один подписал продажу оборудования, которое до сих пор на балансе. Второй одобрил закупку, которая заморозила деньги на складе. Третий видел угрозу, но решил, что всё разрешится само. Начните с того, чего больше нет в цехе."],q:"У каждого решения была подпись. Но никто не подписывался под последствиями."},
{h:"Вы приглашены",sub:"Ваша роль: независимые консультанты ALPHA 3",stamp:"ДОПУСК ВЫДАН",t:"Собственники больше не могут разобраться сами. Вам переданы документы, отчёты, договоры и переписка.",list:["Изучить имущество и ресурсы компании.","Выяснить, почему часть оборудования отсутствует.","Понять, почему склад полон, а производству не хватает.","Определить, почему готовая продукция не приносит денег.","Разработать план восстановления."],q:"Мало найти одного виновного. Нужно понять, как работала вся система."},
{h:"Досье предприятия",sub:"ALPHA 3 · металлоконструкции и детали",stamp:"СРОЧНО",big:[["18 млн ₽","новый заказ"],["30 дней","до срока"],["4,8 млн ₽","долг покупателей"],["420 тыс. ₽","деньги на счёте"]],list:["Часть оборудования простаивает.","На складе избыточные материалы, не хватает комплектующих.","Готовая продукция не отгружена.","Скоро платёж по кредиту."],q:"Если порядок не восстановить, компания потеряет крупного покупателя."},
{h:"Папка № 1. Имущество",sub:"Инвентаризационная ведомость. Не все записи подтверждены проверкой",stamp:"ТРЕБУЕТ ПРОВЕРКИ",t:"Основные фонды служат в деятельности долго. Оборотные средства расходуются, перерабатываются или продаются. Разложите карточки по двум папкам.",sort:1,task:["Почему заводу нужны обе группы ресурсов?"]},
{h:"Первая несостыковка",sub:"Акт проверки основных средств · станок № 17",stamp:"НЕСООТВЕТСТВИЕ",tb:[["Показатель","В документах"],["Местонахождение","Цех № 2"],["Состояние","Исправен"],["Последняя проверка","6 месяцев назад"],["Использование","Включён в производственный план"]],t:"Сотрудники цеха: станка на территории нет. Найден договор купли-продажи. Дата сделки: "+"<span class=red-act>шесть месяцев назад</span>"+". Подписал: "+"<span class=red-act>один из собственников</span>"+". Деньги: "+"<span class=red-act>поступили на счёт</span>"+". Станок "+"<span class=red-act>вывезен</span>"+", а документы и план остались прежними.",q:"Как наличие станка в бумагах и отсутствие в цехе влияет на предприятие?"},
{h:"Что стояло за продажей",sub:"Протокол собрания собственников",stamp:"РЕШЕНИЕ СОГЛАСОВАНО",letter:"«Продажа старого оборудования даст деньги. Станок используется не на полную мощность, продажа сократит расходы на обслуживание».",t:"В протоколе нет: пересмотра производственного плана, проверки потребности в станке, корректировки учёта, оценки влияния на будущие заказы.",c:["Было ли ошибкой само решение продать станок?",[["Да, продавать было нельзя","Спорно: простаивающее оборудование не всегда нужно. Проверьте, что именно не сделали после продажи."],["Продажа могла быть разумной, ошибкой стало отсутствие контроля","Ближе к делу: станок не сняли с плана, не обновили документы и не проверили будущие заказы."]]]},
{h:"Новая покупка",sub:"Договор приобретения оборудования",stamp:"ЗАМОРОЖЕНО",big:[["1,5 млн ₽","новый станок: 800+250+150+100+200 тыс."],["20 дней","до запуска нового"],["350 тыс. ₽","ремонт старого"],["5 дней","срок ремонта"]],t:"Оборудование куплено, но не введено в эксплуатацию. Заказ надо выполнить через 30 дней.",c:["Что выбрать для срочного заказа?",[["Запустить новый станок","Дорого и долго: 20 дней из 30 уйдут на запуск. Но купленный станок нельзя бросать."],["Отремонтировать старый","Быстро и дёшево: экономия 1 150 000 ₽ и 15 дней. Риск: старая техника может снова сломаться."],["Совместить оба","Ремонт закрывает срок заказа, а новый станок вводят параллельно, чтобы он не стал замороженным капиталом."]]]},

const app=document.getElementById("app"),bar=document.querySelector("#bar i"),cnt=document.getElementById("cnt");
let i=0,tok=0;
function render(n){
  i=Math.max(0,Math.min(S.length-1,n));const d=S[i];tok++;pick={};const my=tok;
  let h=`<section class="paper"><div class="tab">ДЕЛО № ${String(i+1).padStart(3,"0")}</div><div class="stamp">${d.stamp}</div>${i==0?"<h1>"+d.h+"</h1>":"<h2>"+d.h+"</h2>"}<p class="sub">${d.sub}</p>`;
  if(d.t)h+=`<p>${d.t}</p>`;
  if(d.note)h+=`<div class="nw"><div class="note"><b>${d.note[0]}</b><i>нажмите, чтобы развернуть</i><span>${d.note[1]}</span></div></div>`;
  if(d.sort)h+=sortHTML();
  if(d.tb)h+=`<table class="tb">${d.tb.map((r,k)=>"<tr>"+r.map(c=>(k?"<td>":"<th>")+c+(k?"</td>":"</th>")).join("")+"</tr>").join("")}</table>`;
  if(d.c)h+=`<div class="ch"><p><b>${d.c[0]}</b></p>${d.c[1].map((o,k)=>`<button data-ch="${k}">${o[0]}</button>`).join("")}<p id="chr">Выберите вариант, чтобы увидеть последствия.</p></div>`;
  if(d.big)h+=`<div class="big">${d.big.map(b=>`<div><b>${b[0]}</b><span>${b[1]}</span></div>`).join("")}</div>`;
  if(d.list)h+=`<ul>${d.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(d.letter)h+=`<div class="letter" id="ty"></div>`;
  if(d.task)h+=`<div class="task"><h3>ЗАДАНИЕ КОМАНДАМ</h3><ul>${d.task.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(d.q)h+=`<div class="q">Вопрос расследования: ${d.q}</div>`;
  app.innerHTML=h+"</section>";
  window.scrollTo(0,0);try{decorate()}catch(e){console.error(e)}
  bar.style.width=((i+1)/S.length*100)+"%";cnt.textContent="ДЕЛО "+(i+1)+"/"+S.length;
  document.getElementById("prev").disabled=i==0;document.getElementById("next").disabled=i==S.length-1;
  const ty=document.getElementById("ty");
  if(ty){let k=0;const txt=d.letter;(function f(){if(my!=tok)return;k+=3;ty.textContent=txt.slice(0,k);if(k<txt.length)setTimeout(f,14);})();}
}
document.getElementById("next").onclick=()=>render(i+1);
document.getElementById("prev").onclick=()=>render(i-1);
addEventListener("keydown",e=>{if(e.key=="ArrowRight")render(i+1);if(e.key=="ArrowLeft")render(i-1)});
let sx=0;addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80)render(i+(dx<0?1:-1))},{passive:true});

// ===== Музыка: три трека, склеенные в один (встроены в страницу) =====
let on=false,bgm=null,muted=false;
const mus=document.getElementById("mus");
function buildAudio(){
  if(bgm)return bgm;
  bgm=document.createElement("audio");
  bgm.src="music.mp3";bgm.loop=true;bgm.preload="auto";bgm.volume=.6;
  bgm.setAttribute("playsinline","");
  document.body.appendChild(bgm);
  return bgm;
}
async function startMusic(){
  muted=false;
  try{const a=buildAudio();await a.play();on=true;mus.textContent="♪ вкл"}
  catch(e){on=false;mus.textContent="♪ выкл"}
}
function stopMusic(){muted=true;if(bgm)bgm.pause();on=false;mus.textContent="♪ выкл"}
mus.onclick=()=>on?stopMusic():startMusic();
// если браузер не дал включить звук сразу — включаем при первом касании
addEventListener("pointerdown",()=>{if(!on&&!muted&&!document.getElementById("intro"))startMusic()},{passive:true});
document.addEventListener("visibilitychange",()=>{if(!bgm)return;if(document.hidden)bgm.pause();else if(on)bgm.play().catch(()=>{})});

function rnd(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function add(par,n,s,css,cls,rr){
  const d=document.createElement("div");
  d.className="st "+cls;
  d.style.cssText=`width:${s}px;height:${s}px;${css};--r:${Math.round(rr()*50-25)}deg;--d:${(3.5+rr()*4).toFixed(1)}s;animation-delay:-${(rr()*5).toFixed(1)}s`;

}

  const names=shuf(NAMES.slice(),rr);let c=0;const nm=()=>names[c++%names.length];
  const sz=(a,b)=>Math.round((a+rr()*(b-a))*k);
  // стикеры «под текстом» на самой бумаге
  for(let n=0;n<(mob?10:15);n++){const s=sz(46,96);add(paper,nm(),s,`left:${(rr()*90).toFixed(1)}%;top:${(rr()*92).toFixed(1)}%`,"b",rr)}
  // стикеры, наклеенные по краям листа
  const per=mob?3:5;
  for(let n=0;n<per;n++){
    let s=sz(42,80);add(paper,nm(),s,`top:${(-s*.55).toFixed(0)}px;left:${(4+rr()*62).toFixed(1)}%`,"f",rr);
    s=sz(42,80);add(paper,nm(),s,`bottom:${(-s*.5).toFixed(0)}px;left:${(3+rr()*86).toFixed(1)}%`,"f",rr);
    s=sz(42,80);add(paper,nm(),s,`left:${(-s*.62).toFixed(0)}px;top:${(6+rr()*84).toFixed(1)}%`,"f",rr);
    s=sz(42,80);add(paper,nm(),s,`right:${(-s*.62).toFixed(0)}px;top:${(6+rr()*84).toFixed(1)}%`,"f",rr);
  }
  // фон за листом
  bgEl.innerHTML="";
  for(let n=0;n<(mob?18:34);n++){const s=sz(40,96);add(bgEl,nm(),s,`left:${(rr()*96).toFixed(1)}%;top:${(rr()*94).toFixed(1)}%;opacity:.7`,"",rr)}
}
